<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Ruby Tag Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        ruby {
            font-size: 35px;
            font-weight: bold;
            color: #2563eb;
        }

        rt {
            font-size: 16px;
            color: #e11d48;
            font-weight: normal;
        }

        p {
            font-size: 18px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>HTML Ruby Tag</h1>

        <p>Japanese Word:</p>

        <ruby>
            日本語
            <rt>にほんご</rt>
        </ruby>

        <p>Meaning: Japanese Language</p>

        <hr>

        <p>Another Example:</p>

        <ruby>
            学校
            <rt>がっこう</rt>
        </ruby>

        <p>Meaning: School</p>

    </div>

</body>
</html>
